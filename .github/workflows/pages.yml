# main 브랜치에 변경이 올라오면 앱을 GitHub Pages 에 자동으로 배포한다.
# 처음 한 번만: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 선택.
name: 앱 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub 기본 Pages 양식처럼 '올리기'와 '배포'를 두 단계로 나눈다.
  # (한 단계에서 올리자마자 배포하면 GitHub 쪽에서 방금 올린 파일을 아직 못 찾아 실패하는 일이 있었다)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 배포할 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
